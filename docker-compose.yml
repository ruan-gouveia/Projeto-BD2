services:
  postgres:
    image: postgres:17-alpine
    container_name: badplay-postgres
    environment:
      POSTGRES_DB: badplay
      POSTGRES_USER: badplay
      POSTGRES_PASSWORD: badplay
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - badplay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badplay -d badplay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  badplay-pgdata:

name: badplay
