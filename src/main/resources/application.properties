# Perfil ativo por padrao: Postgres local em Docker (docker-compose.yml).
# Para voltar a usar o banco remoto do Neon: --spring.profiles.active=neon
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Mostra hit/miss do cache no console
logging.level.org.springframework.cache=TRACE

# Remove aquele monte de INFO "Could not safely identify store assignment..."
spring.data.redis.repositories.enabled=false

server.port=8080
